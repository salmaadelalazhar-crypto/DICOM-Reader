name: Build Windows desktop EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Check required files
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'main.py', 'build_windows.py',
            'requirements.txt', 'requirements-desktop.txt',
            'core/__init__.py', 'core/processing.py',
            'gui/__init__.py', 'gui/main_window.py', 'gui/result_view.py',
            'gui/gemini_panel.py', 'gui/api_key_setup.py', 'gui/widgets.py',
            'gui/workers.py', 'gui/style.py',
            'desktop/__init__.py', 'desktop/api_key.py', 'desktop/i18n.py',
            'desktop/runtime.py', 'desktop/speech.py',
            'desktop/verification.py', 'desktop/translations.json',
            'monai_gemini/__init__.py', 'monai_gemini/prompt.py',
            'monai_gemini/service.py', 'monai_gemini/conversation.py'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw ("Missing files: " + ($missing -join ', ')) }
          Write-Host 'All required files found.'

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip wheel setuptools
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch install failed' }
          python -m pip install -r requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }

      - name: Check Python files compile
        run: |
          python -m compileall -q main.py build_windows.py core gui desktop monai_gemini tests
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax error found' }

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build executable
        run: |
          python build_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path 'dist/DICOMReader/DICOMReader.exe')) { throw 'DICOMReader.exe was not created' }

      - name: Simple smoke test (app stays open for 30 seconds)
        run: |
          $exe = (Resolve-Path 'dist/DICOMReader/DICOMReader.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          if ($p.WaitForExit(30000)) {
            $log = Join-Path $env:LOCALAPPDATA 'DICOMReader/startup.log'
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw ("The app closed by itself during the first 30 seconds (exit code " + $p.ExitCode + ")")
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Smoke test passed: the app started and stayed open for 30 seconds.'

      - name: Add instructions to application folder
        run: Copy-Item README.md,DESKTOP_GUIDE.md dist/DICOMReader/ -Force

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DICOMReader-Windows-x64
          path: dist/DICOMReader/
          if-no-files-found: error
          retention-days: 14

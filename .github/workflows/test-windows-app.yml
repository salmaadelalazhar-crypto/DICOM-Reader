name: Test Windows app (basic, no AI)

# Takes the latest DICOMReader-Windows-x64 artifact built in this repository and tests it on a CLEAN
# machine: Python and every Python library already on the GitHub server are hidden first, and nothing
# is installed. Then it installs the app (copies the folder), opens it, loads a real DICOM file that is
# downloaded from the internet (a trusted, small, publicly available sample), checks the MONAI report
# and turns it into sound. Gemini is NOT tested (it needs an API key).
# This file never installs Python or any library.
#
# The app does NOT contain any built-in/virtual/sample DICOM file. A real radiology image is downloaded
# from a public, stable source (the pydicom project's test files on GitHub) and passed to the app via
# --dicom. The app loads it through its "Choose a file" / "اختيار ملف" flow, exactly the way a real
# user picks a file they downloaded themselves.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Windows desktop EXE']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Find the latest successful build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'workflow_run') {
            $id = '${{ github.event.workflow_run.id }}'
          } else {
            $id = gh run list -R $env:GITHUB_REPOSITORY --workflow build-windows.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          }
          if (-not $id) { throw 'No successful build found. Run "Build Windows desktop EXE" first.' }
          Write-Host "Testing the app built in run $id"
          "run_id=$id" >> $env:GITHUB_OUTPUT

      - name: Download the app artifact
        uses: actions/download-artifact@v4
        with:
          name: DICOMReader-Windows-x64
          path: downloaded-app
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download a real DICOM file from the internet
        id: dicom
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A small, stable, publicly available DICOM sample from the pydicom project.
          # It is a real CT image (about 38 KB) with the standard DICM header, safe and widely used
          # for testing. This is the same file the app would receive if a user clicked
          # "Choose a file" / "اختيار ملف" and picked a DICOM they downloaded themselves.
          $urls = @(
            'https://github.com/pydicom/pydicom/raw/main/src/pydicom/data/test_files/CT_small.dcm',
            'https://raw.githubusercontent.com/pydicom/pydicom/main/src/pydicom/data/test_files/CT_small.dcm'
          )
          $dest = Join-Path $env:RUNNER_TEMP 'sample-dicom'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $file = Join-Path $dest 'CT_small.dcm'
          $ok = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Trying to download: $url"
              Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing -TimeoutSec 60
              $ok = $true
              break
            } catch {
              Write-Host "Download failed from $url : $_"
            }
          }
          if (-not $ok) { throw 'Could not download the sample DICOM file from any source.' }
          # Verify it really is a DICOM file: the DICM magic marker must be present.
          $bytes = [System.IO.File]::ReadAllBytes($file)
          $hasDicm = $false
          for ($i = 0; $i -le ($bytes.Length - 4); $i++) {
            if ($bytes[$i] -eq 0x44 -and $bytes[$i+1] -eq 0x49 -and $bytes[$i+2] -eq 0x43 -and $bytes[$i+3] -eq 0x4D) {
              $hasDicm = $true; break
            }
          }
          if (-not $hasDicm) { throw 'The downloaded file does not look like a DICOM file (no DICM marker found).' }
          $size = (Get-Item $file).Length
          Write-Host "Downloaded a valid DICOM file: $file ($size bytes)"
          "dicom_path=$file" >> $env:GITHUB_OUTPUT
          "dicom_dir=$dest" >> $env:GITHUB_OUTPUT

      - name: Upload the downloaded DICOM file as an artifact (like a user-uploaded file)
        uses: actions/upload-artifact@v4
        with:
          name: DICOMReader-test-input-dicom
          path: ${{ steps.dicom.outputs.dicom_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Make the machine clean (hide Python and all libraries)
        run: |
          # GitHub's Windows servers come with Python, pip and Conda. They are renamed or removed from
          # PATH so the app can only use the Python and libraries packed inside its own folder.
          $hidden = @()
          $places = @("$env:RUNNER_TOOL_CACHE\Python", 'C:\hostedtoolcache\windows\Python',
                      "$env:APPDATA\Python", "$env:LOCALAPPDATA\Programs\Python",
                      'C:\Miniconda', 'C:\Miniconda3', 'C:\Program Files\Python*', 'C:\Python*',
                      'C:\Windows\py.exe', 'C:\Windows\pyw.exe')
          foreach ($place in $places) {
            foreach ($item in (Get-Item -Path $place -Force -ErrorAction SilentlyContinue)) {
              try {
                Rename-Item -LiteralPath $item.FullName -NewName ($item.Name + '.hidden-for-test') -Force -ErrorAction Stop
                $hidden += $item.FullName
              } catch { Write-Host "Could not rename $($item.FullName) (it is removed from PATH instead)." }
            }
          }
          $keep = $env:Path -split ';' | Where-Object {
            $_ -and ($_ -notmatch '(?i)python|conda|pip') -and
            -not (Test-Path (Join-Path $_ 'python.exe')) -and -not (Test-Path (Join-Path $_ 'python3.exe')) -and
            -not (Test-Path (Join-Path $_ 'pip.exe'))
          }
          "CLEAN_PATH=$($keep -join ';')" >> $env:GITHUB_ENV
          Write-Host 'Hidden:'; $hidden | ForEach-Object { Write-Host "  $_" }

      - name: Install the app
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'downloaded-app/DICOMReader.exe')) { throw 'DICOMReader.exe is missing from the artifact' }
          if (-not (Test-Path 'downloaded-app/_internal')) { throw 'The _internal folder is missing from the artifact' }
          # The program needs no installer: installing = copying the whole folder, like a user does.
          $target = Join-Path $env:LOCALAPPDATA 'Programs/DICOMReader'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path 'downloaded-app/*' -Destination $target -Recurse -Force
          Write-Host "Installed to $target"

      - name: Open the app, load the downloaded DICOM, MONAI report and sound
        # Windows PowerShell (part of Windows, not Python) is used so error windows can be read and photographed.
        shell: powershell
        run: |
          $env:Path = $env:CLEAN_PATH
          foreach ($name in 'PYTHONHOME','PYTHONPATH','PYTHONUTF8','PYTHONIOENCODING','PYTHONSTARTUP','VIRTUAL_ENV','CONDA_PREFIX','PIP_DISABLE_PIP_VERSION_CHECK','PIP_NO_INPUT') {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $found = Get-Command python, python3, py, pip, pip3, conda -ErrorAction SilentlyContinue
          if ($found) { throw ('The machine is not clean, Python is still visible: ' + (($found | ForEach-Object { $_.Source }) -join ', ')) }
          Write-Host 'Clean machine confirmed: no Python, pip, Conda or Python libraries can be found.'

          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Drawing, System.Windows.Forms
          $ua = [System.Windows.Automation.AutomationElement]
          $all = [System.Windows.Automation.Condition]::TrueCondition
          function Get-WindowTexts([int]$procId, [switch]$DialogsOnly) {
            $texts = @()
            foreach ($w in $ua::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $all)) {
              try {
                $c = $w.Current
                $ours = ($c.ProcessId -eq $procId) -or ($c.Name -like '*DICOMReader*') -or ($c.Name -like '*DICOM Reader*')
                if (-not $ours) { continue }
                if ($DialogsOnly -and $c.ClassName -ne '#32770') { continue }
                $inner = $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, $all) |
                  ForEach-Object { $_.Current.Name } | Where-Object { $_ -and $_.Trim() } | Select-Object -Unique
                $texts += ('[' + $c.Name + '] ' + ($inner -join ' | '))
              } catch {}
            }
            return $texts
          }
          function Save-Screen([string]$path) {
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save($path); $g.Dispose(); $bmp.Dispose()
              Write-Host "Screenshot saved: $path"
            } catch { Write-Host "Screenshot not possible on this machine: $_" }
          }
          function Escape-Annotation([string]$s) { return $s.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A') }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs/DICOMReader/DICOMReader.exe'
          $log = Join-Path $env:LOCALAPPDATA 'DICOMReader/startup.log'
          $results = Join-Path $env:RUNNER_TEMP 'test-results'
          $missingPattern = '(?i)PACKAGE INCOMPLETE|LIBRARY MISSING|ModuleNotFoundError|No module named|ImportError|DLL load failed|Failed to load Python DLL|python3\d*\.dll|\.dll was not found|could not load the Qt platform plugin|cannot load library|VCRUNTIME'
          $missingCodes = @(-1073741515, -1073741701)   # Windows: required DLL not found / bad DLL
          $failed = $false
          Add-Content $env:GITHUB_STEP_SUMMARY "## DICOMReader test on a clean machine (no Python, no libraries)`n"

          # The real DICOM file downloaded from the internet in the previous step.
          $dicomFile = '${{ steps.dicom.outputs.dicom_path }}'
          if (-not (Test-Path $dicomFile)) { throw "The downloaded DICOM file was not found at $dicomFile" }
          Write-Host "Using real DICOM file for the test: $dicomFile"

          foreach ($lang in 'en', 'ar') {
            $env:DICOM_DEVICE_LANGUAGE = $lang
            $out = Join-Path $results $lang
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Remove-Item $log -ErrorAction SilentlyContinue
            Write-Host "===== Test ($lang) ====="
            # The app is given ONLY the path to the downloaded DICOM file through --dicom.
            # There is no built-in/sample file inside the app. This mirrors a user who downloads a
            # radiology image, then clicks "Choose a file" / "اختيار ملف" inside the app and selects
            # that file. The app loads the real file and runs the MONAI report + sound on it.
            $p = Start-Process -FilePath $exe -ArgumentList @("--dicom=$dicomFile", "--output=$out") -PassThru
            $null = $p.Handle
            $dialog = @(); $problem = ''
            $deadline = (Get-Date).AddMinutes(10)
            while (-not $p.HasExited) {
              $dialog = Get-WindowTexts $p.Id -DialogsOnly
              if ($dialog) { $problem = 'The app showed an error window'; break }
              if ((Get-Date) -gt $deadline) { $problem = 'The app did not finish within 10 minutes'; $dialog = Get-WindowTexts $p.Id; break }
              Start-Sleep -Seconds 2
            }
            if ($problem) {
              Save-Screen (Join-Path $out 'screen.png')
              try { $p.Kill() } catch {}
              $p.WaitForExit(10000) | Out-Null
            }
            $code = if ($p.HasExited) { $p.ExitCode } else { -1 }

            $errorFile = if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" -Encoding utf8 } else { @() }
            $logText = if (Test-Path $log) { Get-Content $log -Encoding utf8 } else { @() }
            if ($errorFile) { Write-Host '--- Error written by the app (error.txt) ---'; $errorFile | ForEach-Object { Write-Host $_ } }
            elseif ($logText -and $code -ne 0) { Write-Host '--- Startup log written by the app ---'; $logText | Select-Object -Last 80 | ForEach-Object { Write-Host $_ } }
            if ($dialog) { Write-Host '--- Text of the window the app showed ---'; $dialog | ForEach-Object { Write-Host $_ } }

            if ($code -eq 0 -and -not $problem) {
              Add-Content $env:GITHUB_STEP_SUMMARY "- **$lang**: PASS`n"
              continue
            }
            $failed = $true
            # The exact message the app itself gave, in order of reliability.
            $exact = ($errorFile | Where-Object { $_ -like 'Exact error shown by the program:*' } | Select-Object -First 1)
            if (-not $exact -and $dialog) { $exact = ($dialog -join "`n") }
            if (-not $exact -and $logText) { $exact = ($logText | Where-Object { $_.Trim() } | Select-Object -Last 1) }
            if (-not $exact) { $exact = "The app closed without any message (exit code $code)." }
            $everything = (@($errorFile) + @($logText) + @($dialog)) -join "`n"
            if (($everything -match $missingPattern) -or ($missingCodes -contains $code)) {
              $title = "App did not work: Python or a library is missing from the app folder ($lang)"
              $text = 'The app could not run without Python and libraries installed on the machine, so something is missing from the packaged folder (_internal). Error shown by the app: ' + $exact
            } else {
              $title = "App did not work ($lang)"
              $text = "$problem Exit code $code. Error shown by the app: " + $exact
            }
            Write-Host ("::error title=$title::" + (Escape-Annotation $text))
            Add-Content $env:GITHUB_STEP_SUMMARY ("- **$lang**: FAIL - $title`n`n  ``````text`n  " + ($exact -replace "`n", "`n  ") + "`n  ```````n")
          }
          if ($failed) { throw 'Test failed - the exact error shown by the app is printed above and in the run summary.' }
          Write-Host 'Test passed in English and Arabic on a clean machine (no Python, no libraries) using a real downloaded DICOM file.'

      - name: Save test results (report text, MP3, errors, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DICOMReader-test-results
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: ignore
          retention-days: 14

name: Test built Windows app

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID (the number at the end of the build run URL)'
        required: true
        type: string
      artifact_name:
        description: 'Name of the app artifact to test'
        required: true
        default: 'DICOMReader-Windows-x64'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  test-built-app:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the previously built app
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded-app
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show all downloaded files and their sizes
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          $files = Get-ChildItem -Path downloaded-app -Recurse -File
          if (-not $files) { throw 'The downloaded artifact contains no files.' }
          $lines = $files | ForEach-Object {
            $relativePath = $_.FullName.Substring((Resolve-Path 'downloaded-app').Path.Length + 1)
            '{0,12:N0} bytes  {1}' -f $_.Length, $relativePath
          }
          $lines | Tee-Object -FilePath test-results/app-files.txt
          Write-Host ("Total: {0} files, {1:N2} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB))
          $emptyFiles = $files | Where-Object Length -eq 0
          if ($emptyFiles) {
            Write-Host 'Zero-byte files found:'
            $emptyFiles.FullName
          }

      - name: Run the app, capture its screen, and check it stays open for 30 seconds
        run: |
          $ErrorActionPreference = 'Stop'
          $exeFiles = @(Get-ChildItem -Path downloaded-app -Recurse -Filter 'DICOMReader.exe' -File)
          if ($exeFiles.Count -ne 1) {
            throw ("Expected exactly one DICOMReader.exe, found " + $exeFiles.Count)
          }
          $exe = $exeFiles[0].FullName
          Write-Host ("Starting: " + $exe)
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          $null = $p.Handle
          $failure = $null
          try {
            if ($p.WaitForExit(20000)) {
              $failure = "App closed by itself before 20 seconds (exit code $($p.ExitCode))."
            }
            else {
              try {
                Add-Type -AssemblyName System.Windows.Forms
                Add-Type -AssemblyName System.Drawing
                $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
                $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try {
                  $graphics.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bounds.Size)
                  $bitmap.Save((Join-Path (Resolve-Path 'test-results').Path 'app-screen.png'), [System.Drawing.Imaging.ImageFormat]::Png)
                }
                finally {
                  $graphics.Dispose()
                  $bitmap.Dispose()
                }
              }
              catch {
                Set-Content -Path test-results/screenshot-error.txt -Value $_.Exception.Message -Encoding utf8
                Write-Warning 'The app is still being tested, but the screenshot could not be captured.'
              }
              Get-Process | Where-Object MainWindowHandle -ne 0 |
                Select-Object ProcessName, Id, MainWindowTitle |
                Format-Table -AutoSize | Out-String -Width 240 |
                Set-Content -Path test-results/visible-windows.txt -Encoding utf8

              if ($p.WaitForExit(10000)) {
                $failure = "App closed by itself before 30 seconds (exit code $($p.ExitCode))."
              }
            }
          }
          catch {
            $failure = $_.Exception.Message
          }
          finally {
            if (-not $p.HasExited) {
              taskkill /PID $p.Id /T /F | Out-Null
            }
            Get-Process -Name 'DICOMReader' -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            $log = Join-Path $env:LOCALAPPDATA 'DICOMReader/startup.log'
            if (Test-Path $log) {
              Copy-Item $log test-results/startup.log -Force
              Get-Content $log -Tail 80
            }
          }
          if ($failure) {
            Set-Content -Path test-results/result.txt -Value $failure -Encoding utf8
            throw $failure
          }
          $success = 'PASS: DICOMReader.exe stayed running for 30 seconds on Windows Server 2022.'
          Set-Content -Path test-results/result.txt -Value $success -Encoding utf8
          Write-Host $success

      - name: Upload screenshot, file list, logs, and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DICOMReader-Windows-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14
